name: Update Google Scholar Citations

on:
  schedule:
    - cron: "0 1 * * *" # Daily at 09:00 Asia/Shanghai (UTC+8)
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: update-google-scholar-citations
  cancel-in-progress: false

jobs:
  update-citations:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch Google Scholar citations
        shell: bash
        run: |
          max_attempts=3
          status=1

          for attempt in $(seq 1 "$max_attempts"); do
            echo "Running citation update attempt $attempt of $max_attempts..."
            if timeout 120 python bin/update_scholar_citations.py; then
              echo "Citation update succeeded on attempt $attempt."
              echo "Citation update succeeded on attempt $attempt." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            else
              status=$?
            fi

            echo "Citation update attempt $attempt failed with exit code $status."
            if [ "$attempt" -lt "$max_attempts" ]; then
              delay=$((attempt * 30))
              echo "Waiting $delay seconds before retrying..."
              sleep "$delay"
            fi
          done

          echo "Citation update failed after $max_attempts attempts; the last known-good data was preserved." | tee -a "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Configure Git
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"

      - name: Commit and push citation data
        id: commit_citations
        shell: bash
        run: |
          git add _data/citations.yml
          if git diff --staged --quiet; then
            echo "No citation data changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Update Google Scholar citations"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy refreshed citation counts
        if: steps.commit_citations.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
